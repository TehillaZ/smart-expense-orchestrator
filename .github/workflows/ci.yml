name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

jobs:
  backend-fast:
    name: Backend fast checks (unit + api + integration)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore solution
        run: dotnet restore backend/ApprovalFlow.sln

      - name: Build solution
        run: dotnet build backend/ApprovalFlow.sln --no-restore --configuration Release

      - name: Fast tests (exclude Journey)
        run: >
          dotnet test backend/ApprovalFlow.sln
          --no-build
          --configuration Release
          --filter "Category!=Journey"
          --verbosity normal

  backend-journey:
    name: Backend journey verification
    runs-on: ubuntu-latest
    needs: backend-fast
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore solution
        run: dotnet restore backend/ApprovalFlow.sln

      - name: Build solution
        run: dotnet build backend/ApprovalFlow.sln --no-restore --configuration Release

      - name: Journey tests
        run: >
          dotnet test backend/ApprovalFlow.JourneyTests/ApprovalFlow.JourneyTests.csproj
          --no-build
          --configuration Release
          --filter "Category=Journey"
          --verbosity normal

  frontend:
    name: Frontend lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  docker-compose:
    name: Docker Compose config and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose -f infra/docker-compose.yml config

      - name: Build compose images
        run: docker compose -f infra/docker-compose.yml build

  e2e-compose:
    name: E2E Docker Compose journeys
    runs-on: ubuntu-latest
    needs:
      - backend-fast
      - docker-compose
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start stack
        run: docker compose -f infra/docker-compose.yml up --build -d

      - name: Wait for gateway health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health >/dev/null; then
              echo "Gateway is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "Gateway did not become healthy in time"
          docker compose -f infra/docker-compose.yml ps
          docker compose -f infra/docker-compose.yml logs --tail=100
          exit 1

      - name: Run compose journey verification
        shell: pwsh
        run: pwsh -File scripts/verify-journeys.ps1 -BaseUrl http://localhost:8080 -ComposeFile infra/docker-compose.yml -WaitSeconds 5

      - name: Collect logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --tail=200

      - name: Tear down stack
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
