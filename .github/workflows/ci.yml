name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore solution
        run: dotnet restore backend/ApprovalFlow.sln

      - name: Build solution
        run: dotnet build backend/ApprovalFlow.sln --no-restore --configuration Release

      - name: Test solution
        run: dotnet test backend/ApprovalFlow.sln --no-build --configuration Release --verbosity normal

      - name: Build API Gateway
        run: dotnet build backend/ApiGateway/ApiGateway.csproj --configuration Release

      - name: Test API Gateway
        run: dotnet test backend/ApiGateway.Tests/ApiGateway.Tests.csproj --configuration Release --verbosity normal

  frontend:
    name: Frontend lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  docker-compose:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose -f infra/docker-compose.yml config
