name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  publish-images:
    name: Publish ${{ matrix.service }}
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: apigateway
            dockerfile: backend/ApiGateway/Dockerfile
            context: .
          - service: intakeservice
            dockerfile: backend/IntakeService/Dockerfile
            context: .
          - service: approvalservice
            dockerfile: backend/ApprovalService/Dockerfile
            context: .
          - service: paymentservice
            dockerfile: backend/PaymentService/Dockerfile
            context: .
          - service: notificationservice
            dockerfile: backend/NotificationService/Dockerfile
            context: .
          - service: frontend
            dockerfile: frontend/Dockerfile
            context: frontend
    steps:
      - name: Checkout CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set image name
        id: image
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "name=${REGISTRY}/${repository}/${{ matrix.service }}" >> "${GITHUB_OUTPUT}"

      - name: Set image tags
        id: tags
        shell: bash
        run: |
          short_sha="${{ github.event.workflow_run.head_sha }}"
          short_sha="${short_sha:0:7}"
          echo "sha_tag=sha-${short_sha}" >> "${GITHUB_OUTPUT}"
          echo "latest_tag=latest" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          # GHCR rejects attestation/index manifests with intermittent "unknown blob".
          provenance: false
          sbom: false
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.tags.outputs.latest_tag }}
            ${{ steps.image.outputs.name }}:${{ steps.tags.outputs.sha_tag }}

      - name: Verify published tags
        shell: bash
        run: |
          for tag in "${{ steps.tags.outputs.latest_tag }}" "${{ steps.tags.outputs.sha_tag }}"; do
            docker buildx imagetools inspect "${{ steps.image.outputs.name }}:${tag}"
          done

  smoke-test:
    name: Smoke test published image
    needs: publish-images
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      REGISTRY: ghcr.io
      JWT_SIGNING_KEY: cd-smoke-test-signing-key-min-32-chars
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: image
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          short_sha="${{ github.event.workflow_run.head_sha }}"
          short_sha="${short_sha:0:7}"
          echo "ref=ghcr.io/${repository}/apigateway:sha-${short_sha}" >> "${GITHUB_OUTPUT}"

      - name: Pull published gateway image
        run: docker pull "${{ steps.image.outputs.ref }}"

      - name: Run gateway health check
        shell: bash
        run: |
          container_id="$(docker run -d \
            -p 8080:8080 \
            -e "Jwt__SigningKey=${JWT_SIGNING_KEY}" \
            "${{ steps.image.outputs.ref }}")"

          cleanup() {
            docker logs "${container_id}" || true
            docker rm -f "${container_id}" || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health; then
              echo "Gateway health check passed."
              exit 0
            fi
            sleep 2
          done

          echo "Gateway health check failed."
          exit 1

      - name: Ensure secrets are not logged
        shell: bash
        run: |
          if [ -n "${ACTIONS_STEP_DEBUG}" ]; then
            echo "Debug logging is enabled; verify secrets remain masked in GitHub Actions UI."
          fi
          echo "Smoke test completed without printing registry credentials."
