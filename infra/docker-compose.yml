services:
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    ports:
      - "16686:16686"
      - "4317:4317"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - approval-network

  prometheus:
    image: prom/prometheus:v3.2.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    depends_on:
      apigateway:
        condition: service_healthy
      intakeservice:
        condition: service_healthy
      approvalservice:
        condition: service_healthy
      paymentservice:
        condition: service_healthy
      notificationservice:
        condition: service_healthy
    networks:
      - approval-network

  apigateway:
    image: ${DOCKER_REGISTRY-}apigateway
    build:
      context: ..
      dockerfile: backend/ApiGateway/Dockerfile
      # Prefer host network during build so NuGet can resolve api.nuget.org (NU1301).
      network: host
    ports:
      - "8080:8080"
    environment:
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-docker-dev-signing-key-min-32-chars}
      Observability__OtlpEndpoint: http://jaeger:4317
      Observability__Enabled: "true"
    depends_on:
      jaeger:
        condition: service_started
      intakeservice:
        condition: service_healthy
      approvalservice:
        condition: service_healthy
      notificationservice:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - approval-network

  redis:
    image: "redis:alpine"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - approval-network

  intakeservice:
    image: ${DOCKER_REGISTRY-}intakeservice
    build:
      context: ..
      dockerfile: backend/IntakeService/Dockerfile
      network: host
    ports:
      - "5001:8080"
    environment:
      Observability__OtlpEndpoint: http://jaeger:4317
      Observability__Enabled: "true"
    depends_on:
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - approval-network

  intakeservice-dapr:
    image: "daprio/daprd:1.14.4"
    restart: unless-stopped
    command: [
      "/daprd",
      "--app-id", "intakeservice",
      "--app-port", "8080",
      "--resources-path", "/components"
    ]
    volumes:
      - ./dapr/components:/components
    depends_on:
      redis:
        condition: service_healthy
      intakeservice:
        condition: service_healthy
    network_mode: "service:intakeservice"

  approvalservice:
    image: ${DOCKER_REGISTRY-}approvalservice
    build:
      context: ..
      dockerfile: backend/ApprovalService/Dockerfile
      network: host
    ports:
      - "5002:8080"
    environment:
      Observability__OtlpEndpoint: http://jaeger:4317
      Observability__Enabled: "true"
      LlmProvider__Provider: ${LlmProvider__Provider:-Stub}
      LlmProvider__Model: ${LlmProvider__Model:-stub}
      LlmProvider__BaseUrl: ${LlmProvider__BaseUrl:-}
      LlmProvider__FallbackProvider: ${LlmProvider__FallbackProvider:-}
      LlmProvider__FallbackModel: ${LlmProvider__FallbackModel:-}
      LlmProvider__FallbackBaseUrl: ${LlmProvider__FallbackBaseUrl:-}
      LlmProvider__RetryCount: ${LlmProvider__RetryCount:-0}
      LlmProvider__RetryDelayMs: ${LlmProvider__RetryDelayMs:-0}
    depends_on:
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - approval-network

  approvalservice-dapr:
    image: "daprio/daprd:1.14.4"
    restart: unless-stopped
    command: [
      "/daprd",
      "--app-id", "approvalservice",
      "--app-port", "8080",
      "--resources-path", "/components"
    ]
    volumes:
      - ./dapr/components:/components
    depends_on:
      redis:
        condition: service_healthy
      approvalservice:
        condition: service_healthy
    network_mode: "service:approvalservice"

  paymentservice:
    image: ${DOCKER_REGISTRY-}paymentservice
    build:
      context: ..
      dockerfile: backend/PaymentService/Dockerfile
      network: host
    ports:
      - "5003:8080"
    environment:
      Observability__OtlpEndpoint: http://jaeger:4317
      Observability__Enabled: "true"
    depends_on:
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - approval-network

  paymentservice-dapr:
    image: "daprio/daprd:1.14.4"
    restart: unless-stopped
    command: [
      "/daprd",
      "--app-id", "paymentservice",
      "--app-port", "8080",
      "--resources-path", "/components"
    ]
    volumes:
      - ./dapr/components:/components
    depends_on:
      redis:
        condition: service_healthy
      paymentservice:
        condition: service_healthy
    network_mode: "service:paymentservice"

  notificationservice:
    image: ${DOCKER_REGISTRY-}notificationservice
    build:
      context: ..
      dockerfile: backend/NotificationService/Dockerfile
      network: host
    ports:
      - "5004:8080"
    environment:
      Observability__OtlpEndpoint: http://jaeger:4317
      Observability__Enabled: "true"
    depends_on:
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - approval-network

  notificationservice-dapr:
    image: "daprio/daprd:1.14.4"
    restart: unless-stopped
    command: [
      "/daprd",
      "--app-id", "notificationservice",
      "--app-port", "8080",
      "--resources-path", "/components"
    ]
    volumes:
      - ./dapr/components:/components
    depends_on:
      redis:
        condition: service_healthy
      notificationservice:
        condition: service_healthy
    network_mode: "service:notificationservice"

  frontend:
    image: ${DOCKER_REGISTRY-}approvalflow-frontend
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_GATEWAY_URL: ""
    ports:
      - "5173:80"
    depends_on:
      apigateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - approval-network

networks:
  approval-network:
    driver: bridge
