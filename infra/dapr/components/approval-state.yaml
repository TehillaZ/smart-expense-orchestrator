apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: approval-state
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: redis:6379
    - name: enableTLS
      value: "false"
    - name: actorStateStore
      value: "false"
scopes:
  - intakeservice
  - approvalservice
  - paymentservice
  - notificationservice
