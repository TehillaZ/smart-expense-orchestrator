# No dapr.io/enabled annotation here — ApiGateway has no Dapr sidecar in Docker Compose
# either (it's a plain YARP reverse proxy with no state/pub-sub/secrets needs of its own).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apigateway
  namespace: approvalflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apigateway
  template:
    metadata:
      labels:
        app: apigateway
    spec:
      containers:
        - name: apigateway
          image: apigateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: Jwt__SigningKey
              valueFrom:
                secretKeyRef:
                  name: approvalflow-secrets
                  key: Jwt__SigningKey
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: apigateway
  namespace: approvalflow
spec:
  type: NodePort
  selector:
    app: apigateway
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
