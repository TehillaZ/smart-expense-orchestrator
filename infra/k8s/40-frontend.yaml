# frontend/nginx.conf reverse-proxies to "apigateway:8080" unchanged — Kubernetes Service
# DNS resolves that name within the approvalflow namespace exactly like Docker Compose did,
# so nothing in the existing nginx config needs to change for Kubernetes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: approvalflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: approvalflow-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: approvalflow
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30173
