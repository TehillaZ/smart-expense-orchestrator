# Template only — copy to 02-secret.yaml and fill in real values before applying.
# 02-secret.yaml is gitignored, same convention as infra/dapr/components/secrets.json.
#
#   cp infra/k8s/02-secret.example.yaml infra/k8s/02-secret.yaml
#
# Two secrets:
#  - approvalflow-secrets: plain env-style values, injected into containers directly.
#  - approvalflow-dapr-secrets-file: the *same* data shaped as the JSON file Dapr's
#    local-secret-store component expects (see 03-dapr-components.yaml) — the app
#    queries secrets by colon-path ("LlmProvider:ApiKey"), which only the local-file
#    store's nested-key support handles; Dapr's native secretstores.kubernetes treats
#    the whole query string as a K8s object name, which can't contain colons at all.
apiVersion: v1
kind: Secret
metadata:
  name: approvalflow-secrets
  namespace: approvalflow
type: Opaque
stringData:
  Jwt__SigningKey: "replace-with-a-signing-key-at-least-32-chars-long"
---
apiVersion: v1
kind: Secret
metadata:
  name: approvalflow-dapr-secrets-file
  namespace: approvalflow
type: Opaque
stringData:
  secrets.json: |
    {
      "LlmProvider": {
        "ApiKey": "replace-with-primary-provider-key",
        "FallbackApiKey": "replace-with-fallback-provider-key"
      },
      "Notification": {
        "SenderAddress": "noreply@example.local"
      }
    }
