apiVersion: apps/v1
kind: Deployment
metadata:
  name: intakeservice
  namespace: approvalflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: intakeservice
  template:
    metadata:
      labels:
        app: intakeservice
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "intakeservice"
        dapr.io/app-port: "8080"
        dapr.io/volume-mounts-readonly: "dapr-secrets:/components"
    spec:
      volumes:
        - name: dapr-secrets
          secret:
            secretName: approvalflow-dapr-secrets-file
      containers:
        - name: intakeservice
          image: intakeservice:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: intakeservice
  namespace: approvalflow
spec:
  selector:
    app: intakeservice
  ports:
    - port: 8080
      targetPort: 8080
